<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>B.Tech Portfolio & Project Hub</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-brand">B.Tech Hub</div>
    <div class="nav-actions">
      <div id="userProfile" class="user-profile hidden">
        <img id="userAvatar" src="" alt="Avatar" class="avatar">
        <span id="userName" class="user-name"></span>
        <button id="logoutBtn" class="btn btn-secondary">Sign Out</button>
      </div>
      <button id="loginBtn" class="btn btn-primary">Sign in with Google</button>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container">
    
    <!-- Hero / Logged Out View -->
    <section id="guestHero" class="hero-card">
      <h1>Developer & Student Workspace</h1>
      <p>Sign in with your Google account to manage private projects, academic records, and personalized portfolio data securely.</p>
      <button id="heroLoginBtn" class="btn btn-primary btn-large">Continue with Google</button>
    </section>

    <!-- Authenticated User Dashboard -->
    <section id="dashboard" class="dashboard hidden">
      
      <!-- Input Section: Save Data -->
      <div class="card">
        <h2>Add Portfolio Project / Note</h2>
        <form id="projectForm">
          <div class="form-group">
            <label for="projectTitle">Title</label>
            <input type="text" id="projectTitle" placeholder="e.g., C Library Engine, Portfolio Site" required maxlength="80">
          </div>
          <div class="form-group">
            <label for="projectCategory">Domain / Category</label>
            <select id="projectCategory">
              <option value="Computer Science">Computer Science</option>
              <option value="Web Development">Web Development</option>
              <option value="Data Structures & Algorithms">Data Structures & Algorithms</option>
              <option value="Personal Note">Personal Note</option>
            </select>
          </div>
          <div class="form-group">
            <label for="projectDescription">Description</label>
            <textarea id="projectDescription" rows="4" placeholder="Brief technical overview or notes..." required maxlength="500"></textarea>
          </div>
          <button type="submit" id="saveBtn" class="btn btn-primary">Save to My Account</button>
        </form>
      </div>

      <!-- User's Isolated Storage Display -->
      <div class="card">
        <div class="card-header">
          <h2>Your Stored Records</h2>
          <span id="recordCount" class="badge">0 entries</span>
        </div>
        <div id="loadingIndicator" class="loading hidden">Loading your data securely...</div>
        <div id="projectList" class="project-list"></div>
      </div>

    </section>

  </main>

  <!-- Firebase Modular SDKs -->
  <script type="module" src="./app.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
